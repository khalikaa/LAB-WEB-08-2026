        <div align="justify">

            <figcaption><strong>Diving & Snorkeling</strong>: Menyelam di titik populer seperti Cape Kri dan Blue Magic <br> melihat pari manta  (manta ray) dan karang-karang yang indah.</figcaption>
            <br><br>
            <img src="https://indonesiajuara.asia/en/wp-content/uploads/2025/06/Puncak-Wayag-Raja-Ampat-Indonesia-Juara-Trip-e1750820069618-900x762.webp" alt="tracking" width="300">

            <br><br>
            <img src="https://i.pinimg.com/originals/23/6a/98/236a98506d68fc9afca55ef72b6e2238.jpg" alt="watching bird" width="300">

            <br><br>
            <img src="https://www.indonesia.travel/contentassets/766c7221563843b6be47a63a833ef3eb/homestay-1.jpg" alt="desa arborek" width="300">
